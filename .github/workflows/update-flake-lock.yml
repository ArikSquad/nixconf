name: Update flake inputs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.3

      - name: Update flake inputs
        run: nix flake update

      - name: Validate updated flake
        run: nix flake check --no-build

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-flake-lock
          delete-branch: true
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            Automated weekly update of all inputs in `flake.lock`.

            The updated flake was evaluated with `nix flake check --no-build`.
