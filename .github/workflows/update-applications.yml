name: Update Applications

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.5

      - name: Update and build T3 Code package
        run: ./scripts/update-t3code.sh

      - name: Update ChatGPT package
        shell: bash
        run: |
          set -euo pipefail

          metadata=$(curl --fail --silent --show-error \
            "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages" \
            | python3 -c '
          import sys

          for stanza in sys.stdin.read().strip().split("\n\n"):
              fields = {
                  key: value
                  for line in stanza.splitlines()
                  if ": " in line
                  for key, value in [line.split(": ", 1)]
              }
              if fields.get("Package") == "chatgpt" and fields.get("Architecture") == "amd64":
                  print(fields["Version"], fields["Filename"])
                  break
          ')

          read -r version filename <<< "$metadata"
          if [[ -z "${version:-}" || -z "${filename:-}" ]]; then
            echo "No ChatGPT amd64 package found in OpenAI's package index" >&2
            exit 1
          fi
          if [[ "$filename" != "pool/main/c/chatgpt/chatgpt_${version}_amd64.deb" ]]; then
            echo "Unexpected ChatGPT package path: $filename" >&2
            exit 1
          fi

          asset_url="https://persistent.oaistatic.com/codex-app-prod/linux/deb/$filename"
          hash=$(nix store prefetch-file --json "$asset_url" | jq -r .hash)

          VERSION="$version" HASH="$hash" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("pkgs/chatgpt.nix")
          text = path.read_text()
          lines = text.splitlines(keepends=True)

          def replace_line(prefix, value):
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      newline = "\n" if line.endswith("\n") else ""
                      lines[index] = f'{prefix}{value}";{newline}'
                      return
              raise SystemExit(f"Could not find line starting with {prefix!r}")

          replace_line('  version = "', os.environ["VERSION"])
          replace_line('    hash = "', os.environ["HASH"])
          path.write_text("".join(lines))
          PY

      - name: Build ChatGPT package
        run: nix build .#chatgpt --no-link --print-build-logs

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-t3code
          delete-branch: true
          commit-message: "chore: update applications"
          title: "chore: update applications"
          body: |
            Automated update of desktop application pins.

            Apps included:
            - t3code
            - ChatGPT

            Both packages were build-checked with Nix.
